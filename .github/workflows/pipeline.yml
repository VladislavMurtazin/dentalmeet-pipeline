name: lead-pipeline

on:
  schedule:
    # Lean Free plan (~2000 min/mo). Disabled jobs stay on workflow_dispatch.
    - cron: "0 8 * * 1,3,5"  # research — Mon/Wed/Fri
    - cron: "0 14 * * 1-5"   # send — weekdays
    - cron: "0 15 * * 1-5"   # followup1 — weekdays
    - cron: "0 16 * * 1-5"   # followup2 — weekdays
    - cron: "0 9,21 * * *"   # replies — 2×/day
    - cron: "0 10,18 * * *"  # check_forms — 2×/day
    - cron: "30 10,18 * * *" # launch_pending — 2×/day
    - cron: "0 11,23 * * *"  # payment_check — 2×/day
    - cron: "0 7,19 * * *"   # warmup_send — 2×/day
    - cron: "30 7,19 * * *"  # warmup_process — 2×/day
    - cron: "30 9 * * 1"     # bounce_cleanup — Monday
    - cron: "0 2 * * 0"      # backup — Sunday
    # OFF (manual only): deliverability, blacklist, daily_summary,
    # weekly_report, case_studies, pilot_invoices, calendar_sync, crm, analytics
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: research
        type: choice
        options:
          - research
          - send
          - reengage
          - followup1
          - followup2
          - replies
          - check_forms
          - launch_pending
          - weekly_report
          - pilot_invoices
          - payment_check
          - warmup_send
          - warmup_process
          - warmup_stats
          - warmup_reset
          - deliverability
          - blacklist_check
          - daily_summary
          - bounce_cleanup
          - backup
          - analytics
          - client_reports
          - calendar_sync
          - crm
          - case_studies
          - all

# Shared secrets for all jobs (per-job env can still override / extend).
env:
  APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
  QWEN_KEY: ${{ secrets.QWEN_KEY }}
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
  SHEET_NAME: ${{ secrets.SHEET_NAME }}
  WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
  GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
  SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
  GOOGLE_SMTP_ACCOUNTS: ${{ secrets.GOOGLE_SMTP_ACCOUNTS }}
  GOOGLE_SMTP_APP_PASSWORDS: ${{ secrets.GOOGLE_SMTP_APP_PASSWORDS }}
  GOOGLE_SMTP_1: ${{ secrets.GOOGLE_SMTP_1 }}
  GOOGLE_SMTP_2: ${{ secrets.GOOGLE_SMTP_2 }}
  GOOGLE_SMTP_3: ${{ secrets.GOOGLE_SMTP_3 }}
  GOOGLE_SMTP_VLADISLAV_PASSWORD: ${{ secrets.GOOGLE_SMTP_VLADISLAV_PASSWORD }}
  PREFER_GOOGLE_SENDERS: "1"
  ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}
  PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
  BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
  CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
  TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
  FORM_RESPONSES_SPREADSHEET: ${{ secrets.FORM_RESPONSES_SPREADSHEET }}
  FORM_RESPONSES_WORKSHEET: ${{ secrets.FORM_RESPONSES_WORKSHEET }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
  ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
  GMAIL_TOKEN_FILE: gmail_token.json
  DRY_RUN: "false"

jobs:
  research:
    name: research
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1,3,5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'research' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME WORKSHEET_NAME APOLLO_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run research
        run: |
          set -euo pipefail
          python -m pipeline.main research
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}

      - name: Scan 2-month-silent Agencies leads (no sheet writes)
        run: |
          set -euo pipefail
          python -m pipeline.main reengage
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          DRY_RUN: "true"

  reengage:
    name: reengage
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'reengage' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List 2-month-silent Agencies leads
        run: |
          set -euo pipefail
          python -m pipeline.main reengage
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          DRY_RUN: "true"

  send:
    name: send
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 14 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'send' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Google SMTP secrets (agency send)
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME WORKSHEET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ -z "${GOOGLE_SMTP_1:-}" ] && [ -z "${GOOGLE_SMTP_VLADISLAV_PASSWORD:-}" ] && [ -z "${GOOGLE_SMTP_APP_PASSWORDS:-}" ]; then
            echo "::error::PREFER_GOOGLE_SENDERS requires a Google Workspace SMTP password (GOOGLE_SMTP_1 / GOOGLE_SMTP_VLADISLAV_PASSWORD / GOOGLE_SMTP_APP_PASSWORDS)"
            missing=1
          fi
          exit "$missing"

      - name: Send first-touch emails (limit 5; includes 60-day re-engage)
        run: |
          set -euo pipefail
          python -m pipeline.main send --limit 5
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_ACCOUNTS: ${{ secrets.GOOGLE_SMTP_ACCOUNTS }}
          GOOGLE_SMTP_APP_PASSWORDS: ${{ secrets.GOOGLE_SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_1: ${{ secrets.GOOGLE_SMTP_1 }}
          GOOGLE_SMTP_2: ${{ secrets.GOOGLE_SMTP_2 }}
          GOOGLE_SMTP_3: ${{ secrets.GOOGLE_SMTP_3 }}
          GOOGLE_SMTP_VLADISLAV_PASSWORD: ${{ secrets.GOOGLE_SMTP_VLADISLAV_PASSWORD }}
          PREFER_GOOGLE_SENDERS: "1"
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          DRY_RUN: "false"

  followup1:
    name: followup1
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'followup1' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          # Optional: Gmail token only needed for IMAP/replies tooling, not Zoho send
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Send follow-up wave 1
        run: |
          set -euo pipefail
          python -m pipeline.main followup 1
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

  followup2:
    name: followup2
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'followup2' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Send follow-up wave 2
        run: |
          set -euo pipefail
          python -m pipeline.main followup 2
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

  replies:
    name: replies
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9,21 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'replies' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          # OAuth token optional if IMAP app password is set
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Restore reply processing state
        uses: actions/cache@v4
        with:
          path: |
            data/processed_replies.json
            data/reply_inbox_failures.json
            data/ooo_followups.json
            data/decline_counts.json
            data/conversation_owners.json
          key: replies-state-${{ github.repository }}
          restore-keys: |
            replies-state-

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME SMTP_ACCOUNTS SMTP_APP_PASSWORDS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check inbox replies
        run: |
          set -euo pipefail
          python -m pipeline.main replies
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_ACCOUNTS: ${{ secrets.GOOGLE_SMTP_ACCOUNTS }}
          GOOGLE_SMTP_APP_PASSWORDS: ${{ secrets.GOOGLE_SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_1: ${{ secrets.GOOGLE_SMTP_1 }}
          GOOGLE_SMTP_2: ${{ secrets.GOOGLE_SMTP_2 }}
          GOOGLE_SMTP_3: ${{ secrets.GOOGLE_SMTP_3 }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_TOKEN_FILE: gmail_token.json

      - name: Persist reply processing state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed_replies.json
            data/reply_inbox_failures.json
            data/ooo_followups.json
            data/decline_counts.json
            data/conversation_owners.json
          key: replies-state-${{ github.repository }}-${{ github.run_id }}

  check_forms:
    name: check_forms
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 10,18 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'check_forms' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Restore conversation owner state
        uses: actions/cache@v4
        with:
          path: |
            data/conversation_owners.json
          key: conversation-owners-${{ github.repository }}
          restore-keys: |
            conversation-owners-

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME SMTP_ACCOUNTS SMTP_APP_PASSWORDS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Ingest form responses
        run: |
          set -euo pipefail
          python -m pipeline.main check_forms
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_ACCOUNTS: ${{ secrets.GOOGLE_SMTP_ACCOUNTS }}
          GOOGLE_SMTP_APP_PASSWORDS: ${{ secrets.GOOGLE_SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_1: ${{ secrets.GOOGLE_SMTP_1 }}
          GOOGLE_SMTP_2: ${{ secrets.GOOGLE_SMTP_2 }}
          GOOGLE_SMTP_3: ${{ secrets.GOOGLE_SMTP_3 }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          FORM_RESPONSES_SPREADSHEET: ${{ secrets.FORM_RESPONSES_SPREADSHEET }}
          FORM_RESPONSES_WORKSHEET: ${{ secrets.FORM_RESPONSES_WORKSHEET }}
          TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}
          GMAIL_TOKEN_FILE: gmail_token.json

      - name: Persist conversation owner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/conversation_owners.json
          key: conversation-owners-${{ github.repository }}-${{ github.run_id }}

  launch_pending:
    name: launch_pending
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 10,18 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'launch_pending' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi
          mkdir -p tokens targets logs data

      - name: Restore conversation owner state
        uses: actions/cache@v4
        with:
          path: |
            data/conversation_owners.json
          key: conversation-owners-${{ github.repository }}
          restore-keys: |
            conversation-owners-

      - name: Launch pending client campaigns
        run: |
          set -euo pipefail
          python -m pipeline.main launch_pending
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_ACCOUNTS: ${{ secrets.GOOGLE_SMTP_ACCOUNTS }}
          GOOGLE_SMTP_APP_PASSWORDS: ${{ secrets.GOOGLE_SMTP_APP_PASSWORDS }}
          GOOGLE_SMTP_1: ${{ secrets.GOOGLE_SMTP_1 }}
          GOOGLE_SMTP_2: ${{ secrets.GOOGLE_SMTP_2 }}
          GOOGLE_SMTP_3: ${{ secrets.GOOGLE_SMTP_3 }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

      - name: Persist conversation owner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/conversation_owners.json
          key: conversation-owners-${{ github.repository }}-${{ github.run_id }}

  weekly_report:
    name: weekly_report
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'weekly_report' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_TOKEN_JSON:-}" ]; then
            echo "::error::Missing secret GMAIL_TOKEN_JSON"
            exit 1
          fi
          printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          test -s gmail_token.json

      - name: Send weekly client reports
        run: |
          set -euo pipefail
          mkdir -p data/client_reports logs
          python -m delivery.client_reports generate-all --send
        env:
