name: lead-pipeline

on:
  schedule:
    - cron: "0 8 * * *"      # research — daily 08:00 UTC
#    - cron: "0 14 * * 1-5"   # send — weekdays 14:00 UTC
#    - cron: "0 15 * * 1-5"   # followup1 — weekdays 15:00 UTC
#    - cron: "0 16 * * 1-5"   # followup2 — weekdays 16:00 UTC
    - cron: "0 */6 * * *"    # replies — every 6 hours
    - cron: "0 */2 * * *"    # check_forms — every 2 hours
    - cron: "30 */2 * * *"   # launch_pending — every 2 hours (:30)
    - cron: "0 9 * * 1"      # weekly reports — Monday 09:00 UTC
    - cron: "15 9 * * *"     # pilot invoices — daily 09:15 UTC (3 weeks after start)
    - cron: "0 10 * * *"     # payment check — daily 10:00 UTC
    - cron: "0 */4 * * *"    # warmup_send — every 4 hours
    - cron: "0 2-23/4 * * *" # warmup_process — 02,06,10,14,18,22 UTC
    - cron: "0 20 * * *"     # daily_summary — 20:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: research
        type: choice
        options:
          - research
          - send
          - followup1
          - followup2
          - replies
          - check_forms
          - launch_pending
          - weekly_report
          - pilot_invoices
          - payment_check
          - warmup_send
          - warmup_process
          - warmup_stats
          - daily_summary
          - all

# Shared secrets for all jobs (per-job env can still override / extend).
env:
  APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
  QWEN_KEY: ${{ secrets.QWEN_KEY }}
  GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
  SHEET_NAME: ${{ secrets.SHEET_NAME }}
  WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
  GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
  SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
  PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
  BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
  CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
  TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
  FORM_RESPONSES_SPREADSHEET: ${{ secrets.FORM_RESPONSES_SPREADSHEET }}
  FORM_RESPONSES_WORKSHEET: ${{ secrets.FORM_RESPONSES_WORKSHEET }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
  ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
  GMAIL_TOKEN_FILE: gmail_token.json
  DRY_RUN: "false"

jobs:
  research:
    name: research
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'research' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME WORKSHEET_NAME APOLLO_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run research
        run: |
          set -euo pipefail
          python -m pipeline.main research
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}

  send:
    name: send
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 14 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'send' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Zoho SMTP secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME WORKSHEET_NAME SMTP_ACCOUNTS SMTP_APP_PASSWORDS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Send first-touch emails (limit 5)
        run: |
          set -euo pipefail
          python -m pipeline.main send --limit 5
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          DRY_RUN: "false"

  followup1:
    name: followup1
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'followup1' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          # Optional: Gmail token only needed for IMAP/replies tooling, not Zoho send
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Send follow-up wave 1
        run: |
          set -euo pipefail
          python -m pipeline.main followup 1
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

  followup2:
    name: followup2
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'followup2' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Send follow-up wave 2
        run: |
          set -euo pipefail
          python -m pipeline.main followup 2
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

  replies:
    name: replies
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'replies' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          # OAuth token optional if IMAP app password is set
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME GMAIL_EMAIL GMAIL_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check inbox replies
        run: |
          set -euo pipefail
          python -m pipeline.main replies
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
          GMAIL_TOKEN_FILE: gmail_token.json

  check_forms:
    name: check_forms
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 */2 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'check_forms' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Ingest form responses
        run: |
          set -euo pipefail
          python -m pipeline.main check_forms
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          FORM_RESPONSES_SPREADSHEET: ${{ secrets.FORM_RESPONSES_SPREADSHEET }}
          FORM_RESPONSES_WORKSHEET: ${{ secrets.FORM_RESPONSES_WORKSHEET }}
          TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}
          GMAIL_TOKEN_FILE: gmail_token.json

  launch_pending:
    name: launch_pending
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 */2 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'launch_pending' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi
          mkdir -p tokens targets logs

      - name: Launch pending client campaigns
        run: |
          set -euo pipefail
          python -m pipeline.main launch_pending
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRESENTATION_URL: ${{ secrets.PRESENTATION_URL }}
          BRIEF_FORM_URL: ${{ secrets.BRIEF_FORM_URL }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

  weekly_report:
    name: weekly_report
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'weekly_report' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_TOKEN_JSON:-}" ]; then
            echo "::error::Missing secret GMAIL_TOKEN_JSON"
            exit 1
          fi
          printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          test -s gmail_token.json

      - name: Send weekly reports
        run: |
          set -euo pipefail
          python -m delivery.weekly_report send_all
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TOKEN_FILE: gmail_token.json
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          DRY_RUN: "false"

  pilot_invoices:
    name: pilot_invoices
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '15 9 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'pilot_invoices' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_TOKEN_JSON:-}" ]; then
            echo "::error::Missing secret GMAIL_TOKEN_JSON"
            exit 1
          fi
          printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          test -s gmail_token.json

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME GMAIL_EMAIL TRC20_WALLET_ADDRESS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Send pilot invoices (3 weeks after start)
        run: |
          set -euo pipefail
          python -m delivery.billing pilot_due --days 21
        env:
          APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          GMAIL_TOKEN_FILE: gmail_token.json
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          DRY_RUN: "false"

  payment_check:
    name: payment_check
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'payment_check' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write runtime secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          fi

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME TRC20_WALLET_ADDRESS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check unpaid / overdue invoices
        run: |
          set -euo pipefail
          python -m delivery.payment_tracker check_overdue
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TRC20_WALLET_ADDRESS: ${{ secrets.TRC20_WALLET_ADDRESS }}
          GMAIL_TOKEN_FILE: gmail_token.json
          DRY_RUN: "false"

  warmup_send:
    name: warmup_send
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 */4 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'warmup_send' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore warmup schedule
        uses: actions/cache@v4
        with:
          path: data/warmup_schedule.json
          key: warmup-schedule-${{ github.repository }}
          restore-keys: |
            warmup-schedule-

      - name: Validate Zoho SMTP secrets
        run: |
          set -euo pipefail
          missing=0
          for name in SMTP_ACCOUNTS SMTP_APP_PASSWORDS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Send warmup emails
        run: |
          set -euo pipefail
          mkdir -p data
          python -m pipeline.warmup send
        env:
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          IMAP_SERVER: imap.zoho.com
          IMAP_PORT: "993"
          DRY_RUN: "false"

      - name: Persist warmup schedule
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/warmup_schedule.json
          key: warmup-schedule-${{ github.repository }}-${{ github.run_id }}

  warmup_process:
    name: warmup_process
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 2-23/4 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'warmup_process' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore warmup schedule
        uses: actions/cache@v4
        with:
          path: data/warmup_schedule.json
          key: warmup-schedule-${{ github.repository }}
          restore-keys: |
            warmup-schedule-

      - name: Validate Zoho SMTP secrets
        run: |
          set -euo pipefail
          missing=0
          for name in SMTP_ACCOUNTS SMTP_APP_PASSWORDS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Process warmup inbox
        run: |
          set -euo pipefail
          mkdir -p data
          python -m pipeline.warmup process
        env:
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          IMAP_SERVER: imap.zoho.com
          IMAP_PORT: "993"
          DRY_RUN: "false"

      - name: Persist warmup schedule
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/warmup_schedule.json
          key: warmup-schedule-${{ github.repository }}-${{ github.run_id }}

  warmup_stats:
    name: warmup_stats
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'warmup_stats' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore warmup schedule
        uses: actions/cache@v4
        with:
          path: data/warmup_schedule.json
          key: warmup-schedule-${{ github.repository }}
          restore-keys: |
            warmup-schedule-

      - name: Show warmup stats
        run: |
          set -euo pipefail
          mkdir -p data
          python -m pipeline.warmup stats
        env:
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}

      - name: Persist warmup schedule
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/warmup_schedule.json
          key: warmup-schedule-${{ github.repository }}-${{ github.run_id }}

  daily_summary:
    name: daily_summary
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'daily_summary' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert metrics
        uses: actions/cache/restore@v4
        with:
          path: |
            data/daily_metrics.json
            data/alert_state.json
            data/failure_log.json
          key: alert-metrics-${{ github.repository }}

      - name: Send daily summary
        run: python -m pipeline.main daily_summary --force
        env:
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}

      - name: Persist alert metrics
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/daily_metrics.json
            data/alert_state.json
            data/failure_log.json
          key: alert-metrics-${{ github.repository }}-${{ github.run_id }}
