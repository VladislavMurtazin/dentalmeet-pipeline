          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

      - name: Persist client report archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/client_reports
          key: client-reports-${{ github.repository }}-${{ github.run_id }}

  calendar_sync:
    name: calendar_sync
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'calendar_sync' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore calendar sync state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/calendar_sync_state.json
            tokens
          key: calendar-sync-${{ github.repository }}
          restore-keys: |
            calendar-sync-${{ github.repository }}-
            calendar-sync-

      - name: Sync Calendly bookings to client calendars
        run: |
          set -euo pipefail
          mkdir -p data tokens
          python -m delivery.calendar_sync sync
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}

      - name: Persist calendar sync state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/calendar_sync_state.json
            tokens
          key: calendar-sync-${{ github.repository }}-${{ github.run_id }}

  crm:
    name: crm
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'crm' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore invoice registry
        uses: actions/cache/restore@v4
        with:
          path: |
            data/invoices/registry.json
            data/invoices/processed_txids.json
            data/crm.json
            data/case_studies.json
          key: crm-data-${{ github.repository }}
          restore-keys: |
            crm-data-${{ github.repository }}-
            crm-data-

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVICE_ACCOUNT SHEET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Export CRM snapshot
        run: |
          set -euo pipefail
          mkdir -p data data/invoices
          python -m pipeline.crm_export export
          python -m delivery.case_studies check
          python -m delivery.case_studies export
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Persist CRM data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/invoices/registry.json
            data/invoices/processed_txids.json
            data/crm.json
            data/case_studies.json
          key: crm-data-${{ github.repository }}-${{ github.run_id }}

  case_studies:
    name: case_studies
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'case_studies' || github.event.inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore case study data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/case_studies.json
            data/case_studies
            data/case_study_rotation.json
          key: case-studies-${{ github.repository }}
          restore-keys: |
            case-studies-${{ github.repository }}-
            case-studies-
            crm-data-

      - name: Weekly case study auto-generate
        run: |
          set -euo pipefail
          mkdir -p data/case_studies
          python -m delivery.case_studies weekly
          python -m delivery.case_studies export
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Persist case study data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/case_studies.json
            data/case_studies
            data/case_study_rotation.json
          key: case-studies-${{ github.repository }}-${{ github.run_id }}

  bounce_cleanup:
    name: bounce_cleanup
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'bounce_cleanup' || github.event.inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore bounce data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bounced_emails.json
            data/blocked_domains.json
          key: bounce-data-${{ github.repository }}

      - name: Scan bounces and mark sheet
        run: |
          set -euo pipefail
          mkdir -p data
          python -m pipeline.main bounce scan
          python -m pipeline.main bounce cleanup
          python -m pipeline.main bounce stats
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SMTP_ACCOUNTS: ${{ secrets.SMTP_ACCOUNTS }}
          SMTP_APP_PASSWORDS: ${{ secrets.SMTP_APP_PASSWORDS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Persist bounce data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/bounced_emails.json
            data/blocked_domains.json
          key: bounce-data-${{ github.repository }}-${{ github.run_id }}
